name: Bolt.Earth
description: 'Bolt.Earth operates what it describes as India''s largest EV charging network, with more
  than 100,000 charging points deployed across 2,100+ cities. The company sells EV charging hardware
  (3.3kW smart sockets for 2/3/4-wheelers, AC chargers from 7.4kW to 22kW, and DC fast chargers from
  30kW to 240kW) alongside a Charging Management System (CMS) for operators and a consumer mobile app
  for locating, booking, and paying for charging sessions. Services span site assessment, installation,
  KYC onboarding, charger activation, remote firmware updates, and 24/7 support for individuals, RWAs,
  enterprises, fleet operators, hospitality venues, highways, and government agencies. Bolt.Earth is
  backed by Version One Ventures and is tracked in the API Evangelist network as an energy-sector
  company profile. No public developer API portal or OpenAPI definition was found during enrichment.'
